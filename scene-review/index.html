<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Scene review · Logan Chalmers</title><link rel="stylesheet" href="review.css?v=1"><script src="/studies/catalogue.js?v=20261110-review1"></script><script defer src="/assets/i18n/language.js?v=20261110-review1"></script><script defer src="review.js?v=1"></script></head><body>
<header class="review-header"><div><a href="/#profile" data-i18n="reviewBack">← Profile</a><h1 data-i18n="sceneReview">Opening scene review</h1></div><div class="language-switch" role="group" aria-label="Language / Reo"><button data-language="en" lang="en" aria-pressed="true">EN</button><button data-language="mi" lang="mi" aria-pressed="false">Te Reo Māori</button></div></header>
<main><div class="toolbar"><div class="segmented" aria-label="Framing" data-i18n-aria="reviewFraming"><button data-frame="opening" aria-pressed="true" data-i18n="reviewOpening">Opening</button><button data-frame="expanded" aria-pressed="false" data-i18n="reviewExpanded">Expanded</button></div><div class="segmented" aria-label="Screen" data-i18n-aria="reviewScreen"><button data-screen="desktop" aria-pressed="true" data-i18n="reviewDesktop">Desktop</button><button data-screen="phone" aria-pressed="false" data-i18n="reviewPhone">Phone</button></div><label class="filter-label"><span class="sr-only" data-i18n="reviewFilter">Filter scenes</span><select id="filter"><option value="unreviewed" data-i18n="reviewUnreviewed">Unreviewed</option><option value="all" data-i18n="reviewAll">All scenes</option><option value="keep" data-i18n="reviewKept">Kept</option><option value="reject" data-i18n="reviewRejected">Rejected</option></select></label><label class="archived"><input id="archived" type="checkbox"><span data-i18n="reviewArchived">Include archived scenes</span></label><span id="counts" aria-live="polite"></span></div>
<section class="review-stage" aria-label="Scene" data-i18n-aria="reviewScene"><div id="card" class="loading" aria-busy="true"><iframe id="preview" title="Opening scene preview" data-i18n-title="reviewPreview" tabindex="-1"></iframe><div class="gesture" aria-hidden="true"><span class="vote-stamp reject">✕</span><span class="vote-stamp keep">✓</span></div><div id="loading" role="status" data-i18n="reviewLoading">Loading the scene…</div></div><div id="empty" hidden><h2 data-i18n="reviewFinished">You’ve reached the end.</h2><p id="empty-copy"></p><button id="review-again" data-i18n="reviewAgain">Review all scenes</button></div></section>
<div class="scene-caption"><div><h2 id="scene-title"></h2><span id="scene-id"></span></div><span id="position"></span></div>
<div class="actions"><button id="undo" class="subtle" data-i18n="reviewUndo">↶ Undo</button><button id="reject" class="reject-action" data-i18n="reviewReject">✕ Reject</button><button id="skip" class="subtle" data-i18n="reviewSkip">Skip</button><button id="keep" class="keep-action" data-i18n="reviewKeep">Keep ✓</button><a id="full-size" href="/" target="_blank" rel="noopener" data-i18n="reviewFull">Full screen ↗</a></div>
<p class="help" data-i18n="reviewHelp">Swipe left to reject, right to keep. Arrow keys work too; Space skips and Z undoes.</p><div class="review-footer"><p id="save-status" aria-live="polite" data-i18n="reviewSaved">Saved in this browser. Your choices don’t change the live site.</p><div><button id="import" data-i18n="reviewImport">Import review</button><input id="import-file" type="file" accept="application/json,.json" hidden><button id="export" data-i18n="reviewExport">Export review ↓</button></div></div></main></body></html>
