<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,follow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening scenes · Logan Chalmers</title><link rel="stylesheet" href="studies.css?v=20261106-delivery"><style>*{box-sizing:border-box}body{margin:0;padding:4vw;background:#f5f2e9;color:#292820;font:16px/1.5 system-ui}header{display:flex;justify-content:space-between;border-bottom:1px solid #c9c4b7;padding-bottom:16px;font-size:13px}a{color:inherit;text-decoration:none}h1{font:400 clamp(40px,5vw,72px)/1 Georgia;letter-spacing:-.045em;margin:6vh 0 3vh}.intro{max-width:45ch;margin-bottom:40px}main{display:grid;grid-template-columns:1fr 1fr;gap:40px 28px}.frame{position:relative;aspect-ratio:5/3;overflow:hidden}h2{font:400 28px/1.1 Georgia;margin:18px 0 8px}article p{font:12px system-ui;color:#70685b;margin:0}a:hover h2{text-decoration:underline}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><span>Logan Chalmers</span><a href="../">Open homepage ↗</a></header><h1>Opening scenes</h1><p class="intro">Three found images, one shared curve. Different materials and palettes on each fresh visit.</p><main id="scenes"></main><script src="catalogue.js?v=20261106-delivery"></script><script src="assets.js?v=20261106-delivery"></script><script>
const container=document.querySelector('#scenes');
const observer=new IntersectionObserver(entries=>{
 for(const entry of entries){
  if(!entry.isIntersecting)continue;
  const frame=entry.target;observer.unobserve(frame);
  const scene=openingScenes.find(item=>item.id===frame.dataset.scene);
  const choice=OpeningAssets.pick(scene,'wide',frame.clientWidth,frame.clientHeight,devicePixelRatio);
  choice.urls=choice.urls.map(url=>'../'+url);
  OpeningAssets.load(choice).then(ok=>{if(ok)OpeningAssets.apply(frame.firstElementChild,choice);});
 }
},{rootMargin:'200px'});
for(const scene of openingScenes.filter(s=>s.active!==false)){
 const article=document.createElement('article'),link=document.createElement('a');
 link.href='../?study='+scene.id;
 const frame=document.createElement('div');frame.className='frame';
 const art=document.createElement('div');art.className='arc-study '+scene.id;art.setAttribute('aria-hidden','true');
 for(let i=0;i<3;i++)art.append(document.createElement('i'));
 frame.dataset.scene=scene.id;frame.append(art);observer.observe(frame);
 const title=document.createElement('h2');title.textContent=scene.title;
 const caption=document.createElement('p');caption.textContent=(scene.angle>0?'+':'')+scene.angle+'° shared inclination';
 link.append(frame,title,caption);article.append(link);container.append(article);
}
</script></html>
