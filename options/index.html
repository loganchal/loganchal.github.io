<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Fifteen openings · Logan Chalmers</title><link rel="stylesheet" href="studies/studies.css?v=20261109-options"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#292924;font:16px/1.5 system-ui}header{display:flex;justify-content:space-between;padding:24px 4vw;border-bottom:1px solid #cbc6b9;font-size:13px}a{color:inherit;text-decoration:none}main{padding:5vw 4vw}h1{font:400 clamp(42px,6vw,88px)/.98 Georgia;letter-spacing:-.045em;margin:0 0 22px}.intro{max-width:48ch;margin-bottom:32px;color:#625e53}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px;position:sticky;top:0;z-index:4;padding:14px 0;background:#f3f0e7ee;backdrop-filter:blur(10px)}button{font:inherit;border:1px solid #c7c2b5;border-radius:24px;background:transparent;padding:10px 17px;cursor:pointer;min-height:44px}button[aria-pressed=true]{background:#292924;color:#f3f0e7;border-color:#292924}.grid{display:grid;grid-template-columns:1fr 1fr;gap:38px 28px}.frame{position:relative;aspect-ratio:5/3;background:#292924;overflow:hidden}.frame.portrait{aspect-ratio:3/5;max-width:440px;margin:auto}.frame.portrait .arc-study{width:max(100cqw,60cqh);height:max(166.666667cqw,100cqh)}h2{font:400 27px/1.12 Georgia;margin:18px 0 6px}article p{font-size:12px;color:#736d60;margin:0}.number{font:11px system-ui;letter-spacing:.09em;margin-right:12px}a:hover h2{text-decoration:underline;text-underline-offset:4px}.frame::after{content:'Open full screen ↗';position:absolute;bottom:12px;left:12px;background:#202522c9;color:#f5f2e9;padding:6px 10px;font-size:11px;opacity:0;transition:opacity .2s}a:hover .frame::after,a:focus-visible .frame::after{opacity:1}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:36px}.toolbar{font-size:13px}}
</style></head><body><header><span>Logan Chalmers</span><a href="/">Homepage ↗</a></header><main><h1>Fifteen openings.</h1><p class="intro">Different materials, different horizons. Each composition shares one curve. Open any scene to try its full-screen entrance.</p><div class="toolbar" aria-label="Compare framing"><button id="wide" aria-pressed="true">Desktop</button><button id="portrait" aria-pressed="false">Phone</button><button id="framing" aria-pressed="false">Settled framing</button></div><div class="grid" id="options"></div></main><script src="options/catalogue.js?v=cb8ce68f8c54"></script><script src="studies/assets.js?v=20261106-delivery"></script><script>
let profile='wide',settled=false,revision=0;const cards=[];
async function draw(card){const token=revision,scene=card.scene;const choice=OpeningAssets.pick(scene,profile,card.frame.clientWidth,profile==='wide'?card.frame.clientWidth*.6:card.frame.clientWidth*5/3,devicePixelRatio);if(!await OpeningAssets.load(choice)||token!==revision)return;card.frame.classList.toggle('portrait',profile==='portrait');OpeningAssets.apply(card.art,choice);card.frame.style.setProperty('--inset',(settled?scene.finalInset:(profile==='wide'?(scene.openingInset??26):(scene.portrait_openingInset??25)))+'%');}
const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){const c=cards.find(c=>c.frame===e.target);c.seen=true;draw(c);observer.unobserve(e.target);}},{rootMargin:'200px'});
openingScenes.forEach((scene,i)=>{const article=document.createElement('article'),link=document.createElement('a'),frame=document.createElement('div'),art=document.createElement('div'),title=document.createElement('h2'),note=document.createElement('p');link.href='options/view.html?study='+encodeURIComponent(scene.id);frame.className='frame';art.className='arc-study';for(let j=0;j<3;j++)art.append(document.createElement('i'));frame.append(art);title.textContent=String(i+1).padStart(2,'0')+'　'+scene.title;note.textContent='Open the full-screen scene ↗';link.append(frame,title,note);article.append(link);document.querySelector('#options').append(article);cards.push({scene,frame,art,seen:false});observer.observe(frame);});
function refresh(){revision++;for(const c of cards)if(c.seen)draw(c);}
for(const id of ['wide','portrait'])document.getElementById(id).onclick=()=>{profile=id;for(const x of ['wide','portrait'])document.getElementById(x).setAttribute('aria-pressed',x===id);refresh();};
document.getElementById('framing').onclick=e=>{settled=!settled;e.currentTarget.setAttribute('aria-pressed',settled);e.currentTarget.textContent=settled?'Opening framing':'Settled framing';refresh();};
</script></body></html>
